# ==================================================================================
# DOCKER COMPOSE CONFIGURATION: docker-compose.yml
# ==================================================================================
#
# WHAT IS DOCKER COMPOSE?
# Instead of manually downloading, installing, and configuring Kafka, PostgreSQL,
# Java, and Node.js on your computer, Docker Compose lets you spin up the entire
# 4-tier QuantStream system with a SINGLE command:
#   docker-compose up --build
#
# THE 4 CONTAINERS RUNNING TOGETHER:
# 1. `kafka`:
#    Apache Kafka 3.8.0 running in modern KRaft mode (no legacy ZooKeeper required!).
#    Listens on port 9092.
# 2. `postgres`:
#    PostgreSQL 16 relational database. Stores alert configs, watchlists, and history.
#    Uses a persistent volume so data isn't lost when containers stop.
# 3. `backend`:
#    The Java Spring Boot backend server.
#    Automatically waits until Kafka and PostgreSQL are healthy before starting up!
# 4. `frontend`:
#    The Next.js React user interface. Runs on http://localhost:3000.
# ==================================================================================

services:
  # Container 1: Apache Kafka Distributed Event Streaming Broker
  kafka:
    image: apache/kafka:3.8.0
    container_name: quantstream-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://quantstream-kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@quantstream-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Container 2: PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: quantstream-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantstream}
      POSTGRES_USER: ${POSTGRES_USER:-quantstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantstream}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantstream} -d ${POSTGRES_DB:-quantstream}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - quantstream-postgres-data:/var/lib/postgresql/data # Persist data on disk

  # Container 3: Spring Boot Java Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantstream-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://quantstream-postgres:5432/${POSTGRES_DB:-quantstream}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-quantstream}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-quantstream}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: quantstream-kafka:29092
      MARKET_DATA_MODE: ${MARKET_DATA_MODE:-simulation} # "simulation" or "live"
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      LIVE_SYMBOLS: ${LIVE_SYMBOLS:-}
      SIMULATION_AUTO_START: "true"
      SERVER_PORT: "8080"
    depends_on:
      kafka:
        condition: service_healthy # Wait until Kafka is ready
      postgres:
        condition: service_healthy # Wait until PostgreSQL is ready

  # Container 4: Next.js Frontend Dashboard UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: quantstream-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      - backend

# Persistent storage volume for PostgreSQL data
volumes:
  quantstream-postgres-data:
