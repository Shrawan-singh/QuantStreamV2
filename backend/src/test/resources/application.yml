spring:
  datasource:
    url: jdbc:h2:mem:quantstream_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
quantstream:
  simulation:
    auto-start: false
